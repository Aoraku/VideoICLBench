# 仅前端（本仓库无 backend/ 时用）：
#   docker compose -f docker-compose.frontend-only.yml up --build
# 打开 http://localhost:5173 ，API 仍指向本机 localhost:8000（需自行在宿主机起后端）。
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
