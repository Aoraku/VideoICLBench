server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 兼容通过 /chat 子路径访问（SECoder 常见部署方式）
  location = /chat {
    return 301 /chat/;
  }

  location /chat/ {
    rewrite ^/chat/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
