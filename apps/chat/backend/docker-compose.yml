# 生产/服务器部署：backend + nginx（80）
# 用法：cp .env.deploy.example .env.deploy 并编辑后执行
#   docker compose up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatglmj-backend:latest
    restart: unless-stopped
    env_file:
      - .env.deploy
    environment:
      SQLITE_PATH: /data/db.sqlite3
    command: ["uvicorn", "backend_app.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - backend_data:/data
      - backend_media:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/app/media:ro

volumes:
  backend_data:
  backend_media:
