sonar.projectKey=chatGLMJ:ChatGLMJ-backend
sonar.projectName=ChatGLMJ

# 指定 SECoder 的 SonarQube 服务器地址
sonar.host.url=https://sonarqube.spring26b.secoder.net

# 以 backend/ 为项目根目录，使 coverage.xml 中的相对路径（chat/...）
# 能与源文件路径（backend/chat/...）正确对应
sonar.projectBaseDir=backend
sonar.sources=backend_app,chat
sonar.tests=chat
sonar.test.inclusions=chat/tests.py
sonar.exclusions=venv/**
sonar.coverage.exclusions=manage.py,backend_app/asgi.py,backend_app/wsgi.py,backend_app/settings.py,backend_app/urls.py,chat/migrations/**
sonar.language=py
sonar.python.coverage.reportPaths=coverage.xml