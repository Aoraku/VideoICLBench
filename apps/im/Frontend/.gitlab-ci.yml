# TODO Start: [Student] URL
image: registry.spring26b.secoder.net/tool/deployer
# TODO End

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script: 
    - export BUILD_IMAGE_NAME=$CI_REGISTRY_IMAGE
    - export BUILD_IMAGE_TAG=$CI_COMMIT_REF_SLUG
    - export BUILD_IMAGE_USERNAME=$CI_REGISTRY_USER
    - export BUILD_IMAGE_PASSWORD=$CI_REGISTRY_PASSWORD
    - deployer build
  only:
    - main

# TODO Start: [Student] Complete test stage
.test_template: &test_template
  image: node:22
  before_script:
    - npm install -g pnpm
    - pnpm install

unit-test:
  <<: *test_template
  script:
    - pnpm test
  after_script:
    - SUFFIX=$RANDOM
    - curl "http://api.spring26b.secoder.net/static/sonar-scanner.tar.gz" -s -o "/tmp/sonar-$SUFFIX.tar.gz"
    - tar -xf "/tmp/sonar-$SUFFIX.tar.gz"  -C /opt
    - sed -i 's/sonarqube.secoder.net/sonarqube.spring26b.secoder.net/g' /opt/sonar-scanner/conf/sonar-scanner.properties
    - sed -i 's/api.secoder.net/api.spring26b.secoder.net/g' /opt/sonar-scanner/bin/sonar-scanner
    - /opt/sonar-scanner/bin/sonar-scanner

style-test:
  <<: *test_template
  script:
    - pnpm lint

# TODO End

deploy:
  stage: deploy
  script:
    - export API_SERVER=https://deployer.spring26b.secoder.net/api
    - deployer dyno replace $CI_PROJECT_NAME "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "$REGISTRY_USER" "$REGISTRY_PWD"
  only:
    - main
