[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videoicl-native-codex-handoff"
version = "2026.11.6"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "mcp>=1.26,<2",
  "playwright>=1.51,<2", "pillow>=11,<13", "imageio-ffmpeg>=0.6,<1",
  "numpy>=1.26,<3", "setproctitle==1.3.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["packages/sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/sdk", "tests"]
asyncio_mode = "auto"
addopts = "-q"
