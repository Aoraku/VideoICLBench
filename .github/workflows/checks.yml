name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/portal/package-lock.json}
      - run: pip install -c requirements.lock.txt -e '.[agents,test]'
      - run: npm --prefix apps/portal ci && npm --prefix apps/portal run build
      - run: npm --prefix apps/chat/frontend/frontend ci && VITE_BASE_PATH=/native-assets/chat/ npm --prefix apps/chat/frontend/frontend run build
      - name: Build native IM frontend
        run: |
          npm install --global pnpm@10.4.1
          pnpm --dir apps/im/Frontend install --frozen-lockfile
          NEXT_PUBLIC_VIC_BENCHMARK=1 pnpm --dir apps/im/Frontend build
      - run: python scripts/build_catalog.py && python scripts/build_contracts.py && python scripts/build_app_modules.py && git diff --exit-code -- tasks apps/portal/src/applicationModules.ts packages/app_runtime/vic_apps/modules.json docs/task-evaluation-map.md
      - run: python -m pytest
      - run: python -m playwright install --with-deps chromium
      - name: Pixel and native UI smoke tests (no video recording)
        run: |
          python scripts/start_platform.py > /tmp/videoicl-control.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          python scripts/smoke_application_pixels.py
          python scripts/check_application_ui.py
          python scripts/check_native_ui.py 1,5,17,23,31,38,43,48,57,68 A
          python scripts/check_native_ui.py 15,16 ABC
          python scripts/check_native_ui.py 61,62,63 ABC
          python scripts/check_v2_communications_ui.py 11 ABC
          VIC_UI_SUITE=v2 python scripts/check_native_ui.py 1,17,68 A
          python scripts/check_workset_delivery_ui.py --tasks 23,74 --variants A
          python scripts/check_cross_platform_ui.py
          python scripts/check_late_recorder_feedback_ui.py
