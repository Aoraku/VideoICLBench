# Layer over compose.yaml. Keep this override in every subsequent compose invocation.
services:
  control:
    image: ${VIC_OS_IMAGE:-videoicl-control-os:local}
    environment:
      VIC_OS_BASE: http://os:8790
      VIC_OS_SOURCE: /opt/os-icl
      VIC_EMBODIED_SOURCE: /opt/tabletop8/simulator
      VIC_EMBODIED_SOCKET: /bridge/tabletop8.sock
      VIC_EMBODIED_KEY: ${VIC_EMBODIED_KEY:-}
    volumes:
      - ${VIC_OS_SOURCE_HOST:-/home/qingle/services/os-icl-e6c8050}:/opt/os-icl:ro
      - ${VIC_EMBODIED_SOURCE_HOST:-/home/qingle/services/videoicl-tabletop8/release-v1}:/opt/tabletop8:ro
      - embodied_bridge:/bridge
    depends_on:
      embodied-relay: {condition: service_started}
      os: {condition: service_healthy}
  embodied-relay:
    image: ${VIC_OS_IMAGE:-videoicl-control-os:local}
    user: "0:0"
    network_mode: host
    command: ["python", "-m", "vic.embodied_relay"]
    volumes: ["embodied_bridge:/bridge"]
    restart: unless-stopped
  os-data-init:
    image: ${VIC_OS_IMAGE:-videoicl-control-os:local}
    user: "0:0"
    command: ["python", "-c", "import os; os.chown('/os-data',10001,10001)"]
    volumes: ["os_data:/os-data"]
    restart: "no"
  os:
    image: ${VIC_OS_IMAGE:-videoicl-control-os:local}
    command: ["python", "/opt/os-icl/server.py", "--host", "0.0.0.0", "--port", "8790"]
    volumes:
      - ${VIC_OS_SOURCE_HOST:-/home/qingle/services/os-icl-e6c8050}:/opt/os-icl:ro
      - os_data:/opt/os-icl/data
    depends_on:
      os-data-init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  embodied_bridge:
  os_data:
